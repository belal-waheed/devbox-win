name: CI/CD Workstation Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Agentic Dotfiles & Web Studio Verification
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate PowerShell AST Syntax Across All Scripts
        shell: pwsh
        run: |
          Write-Host "[== Validating PowerShell AST Syntax across all scripts ==]"
          $allScripts = Get-ChildItem -Path . -Filter "*.ps1" -Recurse
          $hasFailures = $false
          foreach ($script in $allScripts) {
              $tokens = $null
              $parseErrors = $null
              $ast = [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
              if ($parseErrors -and $parseErrors.Count -gt 0) {
                  Write-Host "  [FAIL] Syntax Error in $($script.FullName):" -ForegroundColor Red
                  foreach ($err in $parseErrors) {
                      Write-Host "         Line $($err.Extent.StartLineNumber): $($err.Message)" -ForegroundColor Red
                  }
                  $hasFailures = $true
              } else {
                  Write-Host "  [OK] $($script.Name)" -ForegroundColor Green
              }
          }
          if ($hasFailures) {
              throw "AST syntax validation failed on one or more PowerShell scripts."
          }

      - name: Validate JSON Configuration Files
        shell: pwsh
        run: |
          Write-Host "[== Validating JSON Configuration Files ==]"
          $jsonFiles = Get-ChildItem -Path configs -Recurse -Filter "*.json"
          $hasFailures = $false
          foreach ($file in $jsonFiles) {
              try {
                  $null = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json
                  Write-Host "  [OK] $($file.Name)" -ForegroundColor Green
              } catch {
                  Write-Host "  [FAIL] JSON Syntax Error in $($file.FullName): $($_.Exception.Message)" -ForegroundColor Red
                  $hasFailures = $true
              }
          }
          if ($hasFailures) {
              throw "One or more JSON configuration files failed syntax parsing."
          }

      - name: Automated Security & Leak Audit
        shell: pwsh
        run: |
          Write-Host "[== Scanning for Hardcoded Secrets, Emails, and Local Machine Paths ==]"
          $leaks = Get-ChildItem -Path configs,docs,agent-prompt.md -Recurse -File | Select-String -Pattern '(belwaheed|C:\\Users\\bel|D:\\dev)'
          if ($leaks) {
              Write-Host "  [FAIL] Hardcoded leaks found:" -ForegroundColor Red
              $leaks | ForEach-Object { Write-Host "         $($_.Filename):$($_.LineNumber) -> $($_.Line)" -ForegroundColor Red }
              throw "Security leak audit failed. Remove personal paths and credentials before publishing."
          }
          Write-Host "  [OK] Zero sensitive leaks detected." -ForegroundColor Green

      - name: Verify Web Studio Assets & Bundle Integrity
        shell: pwsh
        run: |
          Write-Host "[== Verifying Web Studio Assets & In-Memory Bundle ==]"
          $required = @(
              "docs/index.html",
              "docs/assets/configs-bundle.js",
              "docs/vendor/jszip.min.js",
              "agent-prompt.md"
          )
          foreach ($path in $required) {
              if (-not (Test-Path $path)) {
                  throw "Missing critical Web Studio file: $path"
              }
              $item = Get-Item $path
              Write-Host "  [OK] $path ($($item.Length) bytes)" -ForegroundColor Green
          }
