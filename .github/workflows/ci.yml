name: CI/CD Workstation Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Windows 11 Provisioning & Module Verification
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate PowerShell AST Syntax Across All Scripts
        shell: pwsh
        run: |
          Write-Host "[== Validating PowerShell AST Syntax across all scripts ==]"
          $allScripts = Get-ChildItem -Path . -Filter "*.ps1" -Recurse
          $hasFailures = $false
          foreach ($script in $allScripts) {
              $tokens = $null
              $parseErrors = $null
              $ast = [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors)
              if ($parseErrors -and $parseErrors.Count -gt 0) {
                  Write-Host "  [FAIL] Syntax Error in $($script.FullName):" -ForegroundColor Red
                  foreach ($err in $parseErrors) {
                      Write-Host "         Line $($err.Extent.StartLineNumber): $($err.Message)" -ForegroundColor Red
                  }
                  $hasFailures = $true
              } else {
                  Write-Host "  [OK] $($script.Name)" -ForegroundColor Green
              }
          }
          if ($hasFailures) {
              throw "AST syntax validation failed on one or more PowerShell scripts."
          }

      - name: Run AAA Automated Unit Test Suite
        shell: pwsh
        run: |
          pwsh -NoProfile -File tests/engine.tests.ps1

      - name: Verify Fullstack Preset Dry-Run Simulation
        shell: pwsh
        run: |
          pwsh -NoProfile -File core/engine.ps1 -DryRun -Preset fullstack

      - name: Run Machine Health Doctor Audit
        shell: pwsh
        run: |
          pwsh -NoProfile -File core/engine.ps1 -Doctor

      - name: Verify Machine State Exporter
        shell: pwsh
        run: |
          pwsh -NoProfile -File core/engine.ps1 -Export -ExportPath config.ci-export.yaml
          if (-not (Test-Path config.ci-export.yaml)) {
              throw "config.ci-export.yaml was not generated by export command."
          }

      - name: Validate Exported YAML Configuration Schema
        shell: pwsh
        run: |
          . core/config.ps1
          $cfg = Read-DevboxConfigFile -Path config.ci-export.yaml
          $val = Test-DevboxConfig -Config $cfg
          if (-not $val.Valid) {
              throw "Exported config failed schema validation: $($val.Errors -join '; ')"
          }
          Write-Host "[OK] Exported YAML configuration successfully validated against devbox-win schema." -ForegroundColor Green
          Remove-Item -Path config.ci-export.yaml -Force
