name: Bug Report
description: Report an issue or unexpected behavior in devbox-win
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue with devbox-win. Please provide as much diagnostic detail as possible to help isolate and resolve the problem.

  - type: input
    id: os_build
    attributes:
      label: Windows 11 Build Number
      description: Run `[System.Environment]::OSVersion.Version.Build` or `winver` in PowerShell.
      placeholder: "e.g. 22631 or 26200"
    validations:
      required: true

  - type: input
    id: ps_version
    attributes:
      label: PowerShell Version
      description: Run `$PSVersionTable.PSVersion` in PowerShell.
      placeholder: "e.g. 7.4.2"
    validations:
      required: true

  - type: textarea
    id: doctor_output
    attributes:
      label: Doctor Audit Output
      description: Please paste the full terminal output of `pwsh -NoProfile -File core/engine.ps1 -Doctor`.
      render: text
    validations:
      required: true

  - type: textarea
    id: command_executed
    attributes:
      label: Command Executed
      description: The exact command line string and options you executed.
      placeholder: "e.g. pwsh -NoProfile -File core/engine.ps1 -Preset fullstack"
    validations:
      required: true

  - type: textarea
    id: error_logs
    attributes:
      label: Error Logs & Terminal Output
      description: Relevant terminal output, error messages, or exception stack traces.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: checkboxes
    id: preflight_checks
    attributes:
      label: Preflight Confirmations
      options:
        - label: I verified that my Windows 11 build is 22000 or higher.
          required: true
        - label: I attempted running with `-DryRun` or checking `core/engine.ps1 -Doctor`.
          required: true
        - label: I checked existing issues to verify this is not a duplicate.
          required: true
