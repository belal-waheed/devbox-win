# devbox-win curated Starship prompt configuration
# Standard: Zero emojis. Clean ASCII/Unicode glyphs.

add_newline = false

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[>](bold green)"
error_symbol = "[x](bold red)"

[directory]
truncation_length = 3
truncation_symbol = ".../"
style = "bold cyan"
read_only = " [RO]"

[git_branch]
symbol = "git:"
style = "bold yellow"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = ">"
behind = "<"
diverged = "<>"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "x"

[cmd_duration]
min_time = 2_000
format = "took [$duration](bold yellow) "

[username]
show_always = false
style_user = "white bold"
format = "[$user]($style)@"

[hostname]
ssh_only = true
style = "bold dimmed white"
format = "[$hostname]($style) "
