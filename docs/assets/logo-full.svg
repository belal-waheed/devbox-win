<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fullPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#b4befe"/>
    </linearGradient>
    <linearGradient id="fullCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89dceb"/>
      <stop offset="100%" stop-color="#74c7ec"/>
    </linearGradient>
    <linearGradient id="cubeTopF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#313244"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="cubeLeftF" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="cubeRightF" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#24273a"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
  </defs>

  <!-- Left Icon Mark (80x80) -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="80" height="80" rx="18" fill="#181825" stroke="#313244" stroke-width="1.5"/>
    
    <!-- Isometric Cube -->
    <path d="M40 16 L64 30 L40 44 L16 30 Z" fill="url(#cubeTopF)" stroke="#45475a" stroke-width="1.5"/>
    <path d="M16 30 L40 44 L40 68 L16 54 Z" fill="url(#cubeLeftF)" stroke="#313244" stroke-width="1.5"/>
    <path d="M40 44 L64 30 L64 54 L40 68 Z" fill="url(#cubeRightF)" stroke="#313244" stroke-width="1.5"/>

    <!-- Tiling Accents -->
    <path d="M31 24 L39 29 L39 37 L31 32 Z" fill="url(#fullCyan)" opacity="0.85"/>
    <path d="M41 30 L49 25 L49 33 L41 38 Z" fill="url(#fullPurple)" opacity="0.85"/>

    <!-- Terminal Glyph -->
    <path d="M23 46 L30 51 L23 56" stroke="#cba6f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="32" y1="56" x2="37" y2="56" stroke="#89dceb" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(108, 0)">
    <text x="0" y="52" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="34" fill="#f0f6fc" letter-spacing="-0.03em">
      devbox<tspan fill="url(#fullPurple)">-win</tspan>
    </text>
    <text x="2" y="76" font-family="'Fira Code', monospace" font-weight="500" font-size="12" fill="#9399b2" letter-spacing="0.14em">
      NATIVE WINDOWS 11 PROVISIONER
    </text>
  </g>
</svg>
